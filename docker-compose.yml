services:
  postgres:
    image: postgres:latest
    container_name: pdf_splitter_db
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pdfdata:/var/lib/postgresql

volumes:
  pdfdata:
